<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}h1,h2,h3,p{margin:0}h1{font-size:20px;font-weight:650;letter-spacing:-.5px}h2{font-size:15px;font-weight:650}h3{font-size:13px;font-weight:600}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.6;cursor:default}a{color:var(--accent)}button:focus-visible,a:focus-visible,select:focus-visible,[tabindex="0"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.hide,[hidden]{display:none!important}.muted{color:var(--muted)}.tabnum{font-variant-numeric:tabular-nums}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
main{max-width:1180px;margin:auto;padding:24px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px}.brandline{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:4px}.version{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 5px}.header-actions{display:flex;align-items:center;gap:14px}.statusbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--good)}.dot.off{background:var(--bad)}.dot.busy{background:var(--accent)}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px;min-height:34px}.button:hover:not(:disabled){border-color:var(--accent)}.button svg{width:14px;height:14px}.gate{margin-top:18px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:20px}.gate h2{font-size:13px}.gate p{font-size:12px;color:var(--muted);margin-top:4px}.gate a{white-space:nowrap;font-size:12px}.alert{margin-top:14px;padding:9px 12px;border-left:3px solid var(--bad);background:var(--panel);border-radius:5px;font-size:12px;color:var(--bad)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:18px}.tabs button{padding:11px 0;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-size:13px}.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:600}.tab-count{margin-left:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 18px}.filter-control{display:flex;align-items:center;gap:8px}.filter-control label{display:none}select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12px;min-height:32px}.results{font-size:11px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-label{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.provider-section{grid-column:1/-1}.provider-section+.provider-section{margin-top:8px}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}.accounttop{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:center;gap:9px;min-width:0}.account-icon{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:650;flex-shrink:0}.account-icon.claude{color:var(--warm)}.identity-text{min-width:0}.account{font-size:13px;overflow-wrap:anywhere}.manual-reset{display:flex;align-items:center;gap:7px;flex-shrink:0;font-size:12px;color:var(--muted)}.manual-reset strong{font-size:18px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}.windows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.window{padding:14px 16px;min-width:0}.window+.window{border-left:1px solid var(--line)}.windowhead h3{font-size:12px;color:var(--muted);font-weight:500}.quota-value{display:flex;align-items:baseline;gap:5px;margin-top:7px}.percent{font-size:22px;letter-spacing:-.4px;font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums}.percent-unit{font-size:14px;margin-left:1px}.remaining-label{font-size:11px;color:var(--muted)}.low .percent{color:var(--bad)}.track{height:3px;border-radius:4px;background:var(--track);margin:7px 0 10px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:4px}.low .fill{background:var(--bad)}.unknown .percent{color:var(--muted)}.windowstats{margin:0;padding:0;border:0;background:none}.estimate-cost{display:flex;align-items:baseline;gap:7px;font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.3;font-variant-numeric:tabular-nums}.estimate-cost .unit{font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted)}.estimate-value{font-size:14px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.reset{font-size:12px;color:var(--muted);margin-top:10px}.account-error{margin:8px 16px 0;font-size:11px;color:var(--bad);overflow-wrap:anywhere}.empty{grid-column:1/-1;padding:28px 16px;border:1px dashed var(--line);border-radius:10px;background:var(--panel);text-align:center;color:var(--muted)}.empty-symbol{display:none}.empty strong{font-size:13px;color:var(--ink)}.empty p{font-size:12px;margin-top:5px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 0;margin-bottom:20px}.summary-item{padding:0 16px;min-width:0}.summary-item+.summary-item{border-left:1px solid var(--line)}.summary-label{font-size:11px;color:var(--muted)}.summary-value{font-size:21px;font-weight:650;letter-spacing:-.4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.summary-note{display:none}.request-section+.request-section{margin-top:20px}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.tablewrap .empty{border:0}table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:990px;font-size:12px}th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;background:var(--subtle)}td{padding:11px 12px;border-top:1px solid var(--line);overflow-wrap:anywhere;vertical-align:middle;font-variant-numeric:tabular-nums}td.num,th.num{text-align:right;white-space:nowrap}.usd-value{font-size:14px;font-weight:650}.timestamp{font-size:11px}.cell-secondary{display:block;font-size:10px;color:var(--muted);margin-top:2px}.model{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.model+.model{margin-top:4px}.request-state{font-size:11px;color:var(--good)}.request-state.failed,.failure-count{color:var(--bad)}.cache-pair .slash{padding:0 3px;color:var(--muted)}.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);margin-top:10px}.pagination{display:flex;align-items:center;gap:8px}.pagination .button{padding:3px 9px;min-height:28px}.credential-button{display:flex;align-items:baseline;gap:6px;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;font-weight:550;width:100%}.credential-button:hover{color:var(--accent)}.chevron{color:var(--muted)}.credential-name{min-width:0;overflow-wrap:anywhere}.details-cell{background:var(--subtle);padding:0 16px}.details{padding:10px 0}.details h3{font-size:11px;color:var(--muted);margin-bottom:6px}.modelrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:11px}.foot{margin-top:18px;font-size:10px;color:var(--muted)}
@media(max-width:760px){main{padding:18px 14px}.grid{grid-template-columns:minmax(0,1fr)}.masthead{gap:10px}.header-actions{gap:8px}.statusbar{display:none}.toolbar{margin-bottom:16px}.results{font-size:10px;text-align:right}.accounttop{padding:11px 14px}.window{padding:12px 14px}.summary{grid-template-columns:repeat(2,minmax(0,1fr));padding:0}.summary-item{padding:10px 14px}.summary-item:nth-child(3){border-left:0}.summary-item:nth-child(n+3){border-top:1px solid var(--line)}.gate{display:block}.gate a{display:inline-block;margin-top:8px}.table-foot>span{max-width:220px}}
@media(max-width:380px){.window{padding:12px}.accounttop{align-items:flex-start;flex-wrap:wrap}.results{max-width:145px}.manual-reset{margin-left:auto}}
.needs-login .tabs,.needs-login .toolbar,.needs-login [role=tabpanel],.needs-login .foot{display:none}
</style>
</head>
<body>
<main id="dashboard">
<header class="masthead">
  <div>
    <div class="brandline"><span>CPA Mini Usage</span><span class="version">v0.1.4</span></div>
    <h1>用量与额度</h1>
  </div>
  <div class="header-actions">
    <div class="statusbar" role="status"><span class="dot off" id="dot" aria-hidden="true"></span><span id="status">正在读取登录状态</span></div>
    <button class="button" id="refresh" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .2 5M16 3v4h-4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="refresh-label">刷新额度</span></button>
  </div>
</header>
<section id="gate" class="gate hide" aria-labelledby="gate-title"><div><h2 id="gate-title">需要 CPA 登录</h2><p>请在同源 CPA 管理页面登录并勾选“记住密码”。插件不支持复用跨域或未保存的登录。</p></div><a href="/management.html" target="_top">前往 CPA 登录 ↗</a></section>
<div id="alert" class="alert hide" role="status" aria-live="polite"></div>
<div class="tabs" role="tablist" aria-label="用量视图">
  <button id="tab-quota" type="button" role="tab" aria-controls="page-quota" aria-selected="true" tabindex="0">剩余额度 <span class="tab-count" id="quota-count">—</span></button>
  <button id="tab-requests" type="button" role="tab" aria-controls="page-requests" aria-selected="false" tabindex="-1">请求明细 <span class="tab-count" id="request-count">—</span></button>
</div>
<div class="toolbar"><div class="filter-control"><label for="provider">服务商</label><select id="provider" aria-label="筛选服务商"><option value="">全部服务商</option><option value="claude">Claude</option><option value="codex">Codex</option></select></div><span id="updated" class="results" aria-live="polite">等待同步</span></div>
<section id="page-quota" role="tabpanel" aria-labelledby="tab-quota" tabindex="0">
  <div id="quota-cards" class="grid"><div class="empty"><strong>正在读取 CPA 登录状态…</strong></div></div>
</section>
<section id="page-requests" role="tabpanel" aria-labelledby="tab-requests" tabindex="0" class="hide">
  <div id="request-summary" class="summary" aria-label="近 7 天观测统计"></div>
  <section class="request-section" aria-labelledby="recent-title">
    <div class="section-head"><h2 id="recent-title">近期请求</h2><span class="section-label">最多 60 条</span></div>
    <div id="recent-table" class="tablewrap" role="region" aria-label="近期请求表，窄屏可横向滚动" tabindex="0"></div>
    <div class="table-foot"><span id="recent-caption">等待请求快照</span><nav class="pagination" aria-label="近期请求分页"><button class="button" type="button" id="recent-prev" aria-label="上一页" disabled>‹</button><span id="recent-page" class="tabnum">0 / 0</span><button class="button" type="button" id="recent-next" aria-label="下一页" disabled>›</button></nav></div>
  </section>
  <section class="request-section" aria-labelledby="credentials-title">
    <div class="section-head"><h2 id="credentials-title">凭证用量 · 近 7 天</h2><span id="credential-count" class="section-label">— 个凭证</span></div>
    <div id="credential-table" class="tablewrap" role="region" aria-label="凭证用量表，窄屏可横向滚动" tabindex="0"><div class="empty">等待同步</div></div>
  </section>
</section>
<footer class="foot" id="footer">页面每分钟同步 · 额度每 3 分钟检查</footer>
</main>
<script>
(() => {
'use strict';
let key = '', data = null, tab = 'quota', filter = '', expanded = '';
let loading = false, phase = 'waiting', loadSerial = 0, recentPage = 0;
let quotaStamp='',requestStamp='',lastSyncAt=0;
const pageSize = 10;
const $ = id => document.getElementById(id);
const endpoint = '/v0/management/plugins/cpa-mini-usage/';
const fmt = n => n == null || !Number.isFinite(+n) ? '\u2014' : new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n);
const tokenUnits = [{scale:1,suffix:''},{scale:1e3,suffix:'k'},{scale:1e6,suffix:'m'},{scale:1e9,suffix:'b'}];
function tokens(value){
  if(value==null || !['number','string'].includes(typeof value) || (typeof value==='string' && !value.trim()))return '\u2014';
  const n=Number(value);if(!Number.isFinite(n) || n<0)return '\u2014';
  let unit=0;while(unit<tokenUnits.length-1 && n>=tokenUnits[unit+1].scale)unit++;
  const precision=()=>unit===0?1:100;
  let rounded=Math.round(n/tokenUnits[unit].scale*precision())/precision();
  if(rounded>=1000 && unit<tokenUnits.length-1){unit++;rounded=Math.round(n/tokenUnits[unit].scale*precision())/precision();}
  return new Intl.NumberFormat('en-US',{maximumFractionDigits:unit===0?0:2}).format(rounded)+tokenUnits[unit].suffix;
}
const money = n => n == null || !Number.isFinite(+n) ? '\u2014' : '$'+Number(n).toFixed(n<1?3:2);
const when = s => {if(!s)return '待更新';const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleString('zh-CN',{hour12:false}):'未知时间';};
function resetCountdown(value,now=Date.now()){
  if(!value)return '重置时间待更新';
  const end=new Date(value).getTime();if(!Number.isFinite(end))return '重置时间待更新';
  const remaining=end-now;if(remaining<=0)return '等待额度更新';
  const minutes=Math.ceil(remaining/60000),days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60),mins=minutes%60;
  if(days>0)return '还有 '+days+' 天 '+hours+' 小时重置';
  if(hours>0)return '还有 '+hours+' 小时 '+mins+' 分钟重置';
  return '还有 '+mins+' 分钟重置';
}
const clock = s => {if(!s)return '待更新';const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleTimeString('zh-CN',{hour12:false}):'未知时间';};
const el = (tag,cls,text) => {const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;};
const append = (target,...nodes) => {nodes.forEach(n=>target.append(n));return target;};
const add = (t,tag,cls,text) => {const e=el(tag,cls,text);t.append(e);return e;};
const addTokens = (target,tag,cls,value,tail=' tokens') => {const e=add(target,tag,cls,tokens(value)+tail);e.title=fmt(value)+' tokens';return e;};
const list = value => Array.isArray(value)?value:[];
const active = d => !filter || d.provider===filter;
const providerName = p => ({claude:'Claude',codex:'Codex'}[p]||p||'未知服务商');
const modelName = m => typeof m==='string' && m.trim()?m:'未知模型';
const credentialName = s => s?.name||s?.auth_id||'未知凭证';
function remainingPercent(win){
  const value=win?.used_percent;
  if(value==null || (typeof value==='string' && !value.trim()) || !['number','string'].includes(typeof value))return null;
  const used=Number(value);return Number.isFinite(used)?100-Math.max(0,Math.min(100,used)):null;
}
function remainingEstimate(total,percent){
  if(total==null || percent==null || !['number','string'].includes(typeof total) || (typeof total==='string' && !total.trim()))return null;
  if(!Number.isFinite(Number(total)) || Number(total)<0 || !Number.isFinite(Number(percent)))return null;
  return Number(total)*(Math.max(0,Math.min(100,Number(percent)))/100);
}
function updateCountdowns(){
  document.querySelectorAll('[data-reset-at]').forEach(node=>{const value=resetCountdown(node.dataset.resetAt);if(node.textContent!==value)node.textContent=value;});
}
function quotaContent(snapshot){return JSON.stringify(list(snapshot?.quotas).map(({fetched_at,...account})=>account));}
function requestContent(snapshot){return JSON.stringify([snapshot?.credentials,snapshot?.recent,list(snapshot?.quotas).map(({auth_id,name,provider})=>({auth_id,name,provider}))]);}
function acceptSnapshot(snapshot){
  const quotas=quotaContent(snapshot),requests=requestContent(snapshot),focused=document.activeElement?.id;
  data=snapshot;phase='ready';
  if(quotas!==quotaStamp){renderQuotas();quotaStamp=quotas;}
  if(requests!==requestStamp){renderRequests();requestStamp=requests;}
  updateCountdowns();updateSyncInfo();restoreFocus(focused);
}
function updateSyncInfo(){
  $('updated').textContent=data?'额度更新 '+clock(data.quota_updated_at):loading?'正在同步…':'尚未同步';
  $('updated').title=data?'快照：'+when(data.generated_at)+'\n额度：'+when(data.quota_updated_at):'';
}
function empty(title,description){
  const box=el('div','empty');const icon=add(box,'span','empty-symbol','—');icon.setAttribute('aria-hidden','true');
  add(box,'strong','',title);if(description)add(box,'p','',description);return box;
}
function noData(){
  if(loading)return empty('正在同步用量…','正在从当前 CPA 实例读取快照，请稍候。');
  if(phase==='error')return empty('暂时无法读取数据','为避免误读，已清除旧快照。请检查连接后点击右上角重试。');
  return empty('需要 CPA 登录','请在同源 CPA 管理页面登录并保存登录状态。');
}
function setAlert(msg){$('alert').textContent=msg||'';$('alert').classList.toggle('hide',!msg);}
function readCPAStorage(storage,name){
  try {
    let raw=storage.getItem(name);if(!raw)return null;
    const encoded=raw.startsWith('enc::v1::');
    if(encoded){
      const mask=new TextEncoder().encode('cli-proxy-api-webui::secure-storage|'+location.host+'|'+navigator.userAgent);
      const bytes=Uint8Array.from(atob(raw.slice(9)),c=>c.charCodeAt(0));
      raw=new TextDecoder('utf-8',{fatal:true}).decode(bytes.map((byte,i)=>byte^mask[i%mask.length]));
    }
    try{return JSON.parse(raw);}catch{return encoded||raw.startsWith('enc::')?null:raw;}
  }catch{return null;}
}
function guessKey(){
  if(!/^https?:$/.test(location.protocol))return '';
  for(const kind of ['localStorage','sessionStorage']){
    let storage;try{storage=window[kind];}catch{continue;}if(!storage)continue;
    const auth=readCPAStorage(storage,'cli-proxy-auth');const state=auth?.state||auth;
    const legacyBase=readCPAStorage(storage,'apiBase')||readCPAStorage(storage,'apiUrl');
    const base=state?.apiBase||legacyBase;
    if(base){try{if(typeof base!=='string'||new URL(base,location.origin).origin!==location.origin)continue;}catch{continue;}}
    const candidate=state?.managementKey||readCPAStorage(storage,'managementKey');
    if(typeof candidate==='string' && candidate.trim())return candidate.trim();
  }
  return '';
}
async function api(path,method='GET') {
  if(!key)throw Error('请返回 CPA 管理页面登录，插件会自动复用同源保存的登录状态。');
  const res=await fetch(endpoint+path,{method,headers:{'Authorization':'Bearer '+key},cache:'no-store',credentials:'same-origin',redirect:'error'});
  if(res.status===401 || res.status===403){const err=Error('CPA 登录已失效或远程管理未启用，请返回 CPA 管理页面重新登录。');err.auth=true;throw err;}
  if(!res.ok)throw Error('CPA 返回 HTTP '+res.status+'，请稍后重试。');
  return res.json();
}
function syncControls(){
  $('refresh').disabled=loading;$('refresh-label').textContent=loading?'正在同步…':phase==='error'?'重试连接':'刷新额度';
  $('dot').classList.toggle('off',!data&&!loading);$('dot').classList.toggle('busy',loading);
  $('page-quota').setAttribute('aria-busy',String(loading));$('page-requests').setAttribute('aria-busy',String(loading));
}
function clearSnapshot(needsLogin,message){
  data=null;expanded='';recentPage=0;phase=needsLogin?'waiting':'error';
  $('dashboard').classList.toggle('needs-login',needsLogin);
  $('status').textContent=needsLogin?'等待 CPA 登录':'连接失败';$('gate').classList.toggle('hide',!needsLogin);
  setAlert(message);render();
}
async function load(force=false){
  const serial=++loadSerial, saved=guessKey();
  if(key!==saved){data=null;expanded='';recentPage=0;}
  const quiet=!force&&Boolean(data)&&key===saved;
  key=saved;if(!quiet)setAlert('');
  if(!key){loading=false;clearSnapshot(true,'');syncControls();return;}
  loading=true;phase='loading';$('dashboard').classList.remove('needs-login');$('gate').classList.add('hide');if(!quiet){$('status').textContent=force?'正在刷新额度':'正在连接';syncControls();}
  if(!data)render();
  try {
    let finishedBefore=data?.quota_refresh_finished_at;
    if(force){const accepted=await api('refresh','POST');finishedBefore=accepted.quota_refresh_finished_at??finishedBefore;if(serial!==loadSerial)return;}
    const deadline=Date.now()+120000;
    let snapshot, waiting=false;
    do {
      snapshot=await api('data');
      if(serial!==loadSerial)return;
      if(guessKey()!==saved){await load();return;}
      if(!snapshot || typeof snapshot!=='object' || Array.isArray(snapshot))throw Error('CPA 快照格式异常。');
      acceptSnapshot(snapshot);lastSyncAt=Date.now();
      waiting=force&&(snapshot.quota_refreshing||!snapshot.quota_refresh_finished_at||snapshot.quota_refresh_finished_at===finishedBefore);
      if(!waiting)break;
      $('status').textContent='正在刷新额度';
      await new Promise(resolve=>setTimeout(resolve,2000));
      if(serial!==loadSerial)return;
    }while(Date.now()<deadline);
    const issues=[data.storage_error,data.price_error,data.quota_error,waiting?'额度接口响应较慢，稍后自动同步。':''].filter(Boolean);
    $('status').textContent=data.quota_refreshing?'额度刷新中':issues.length?'部分数据异常':'已连接';setAlert(issues.join(' · '));
  } catch(err) {
    if(serial!==loadSerial)return;
    loading=false;
    if(quiet&&!err.auth){setAlert(err.message||'同步失败，可手动重试。');}else{clearSnapshot(Boolean(err.auth),err.message||'无法连接 CPA。');}
  } finally {
    if(serial===loadSerial){loading=false;syncControls();}
  }
}
function addWindow(parent,title,period,win){
  const remaining=remainingPercent(win);
  const section=add(parent,'section','window'+(remaining==null?' unknown':remaining<20?' low':''));
  const h=add(section,'div','windowhead');add(h,'h3','',title);
  const value=add(section,'div','quota-value');const percent=add(value,'span','percent',remaining==null?'—':remaining.toFixed(1));
  if(remaining!=null)add(percent,'span','percent-unit','%');add(value,'span','remaining-label',remaining==null?'额度未知':'剩余');
  const track=add(section,'div','track');track.setAttribute('role','meter');track.setAttribute('aria-label',title+'官方剩余额度');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');
  if(remaining!=null)track.setAttribute('aria-valuenow',String(remaining));track.setAttribute('aria-valuetext',remaining==null?'未知':remaining.toFixed(1)+'% 剩余');
  const fill=add(track,'div','fill');fill.style.width=(remaining??0)+'%';
  const cost=win?.missing_price?null:remainingEstimate(win?.estimated_total_cost,remaining);
  const stats=add(section,'div','windowstats');
  const amount=add(stats,'div','estimate-cost',money(cost));add(amount,'span','unit','USD 估算');
  const available=remainingEstimate(win?.estimated_total_tokens,remaining);
  addTokens(stats,'div','estimate-value',available,' tokens');
  const reset=add(section,'div','reset',resetCountdown(win?.reset_at));reset.title=when(win?.reset_at);if(win?.reset_at)reset.dataset.resetAt=win.reset_at;
  if(win?.missing_price)amount.title='缺少模型单价，金额暂不可用';
}
function renderQuotas(){
  const root=$('quota-cards');root.replaceChildren();
  const quotas=list(data?.quotas).filter(active);$('quota-count').textContent=data?fmt(quotas.length):'—';
  if(!data){root.append(noData());return;}
  if(!quotas.length){root.append(empty(filter?'此服务商暂无 OAuth 额度':'还没有可用的 OAuth 额度','请检查 Claude / Codex 凭证是否支持额度查询，或点击“刷新额度”重新检查。'));return;}
  const providers=[...new Set(quotas.map(q=>q.provider))].sort((a,b)=>a.localeCompare(b));
  providers.forEach(provider=>{
    const accounts=quotas.filter(q=>q.provider===provider);
    const section=add(root,'section','provider-section');section.dataset.provider=provider;
    const heading=add(section,'div','section-head');add(heading,'h2','',providerName(provider));add(heading,'span','section-label',accounts.length+' 个账户');
    const cards=add(section,'div','grid');
    accounts.forEach((item,i)=>{
      const panel=el('article','panel');
      const head=add(panel,'div','accounttop');const identity=add(head,'div','identity');
      const icon=add(identity,'span','account-icon'+(item.provider==='claude'?' claude':''),item.provider==='claude'?'C':'⌘');icon.setAttribute('aria-hidden','true');
      const text=add(identity,'div','identity-text');add(text,'h3','account',credentialName(item));
      if(item.error)add(panel,'p','account-error',item.error);
      const grid=add(panel,'div','windows');addWindow(grid,'5 小时','5h',item.five_hour);addWindow(grid,'7 天','7d',item.seven_day);
      if(Number.isSafeInteger(item.manual_reset_remaining)&&item.manual_reset_remaining>=0){const bank=add(head,'div','manual-reset');add(bank,'span','','Reset bank');add(bank,'strong','',fmt(item.manual_reset_remaining));add(bank,'span','','次');}
      cards.append(panel);
    });
  });
}
function addCell(tr,what,align){return add(tr,'td',align||'',what);}
function makeTable(root,caption,columns){
  const table=add(root,'table','');add(table,'caption','sr-only',caption);
  const group=add(table,'colgroup','');columns.forEach(([, ,width])=>{const col=add(group,'col','');col.style.width=width+'%';});
  const thead=add(table,'thead',''),head=add(thead,'tr','');columns.forEach(([label,cls])=>add(head,'th',cls,label).setAttribute('scope','col'));
  return add(table,'tbody','');
}
function renderSummary(credentials){
  const root=$('request-summary');root.replaceChildren();const sum=field=>credentials.reduce((n,s)=>n+(Number(s[field])||0),0);
  const priceMissing=credentials.some(s=>s.missing_price||s.cost==null);
  const stats=[['近 7 天请求',data?fmt(sum('requests')):'—'],['tokens',data?tokens(sum('total')):'—'],['失败',data?fmt(sum('failures')):'—'],['USD 估算',data?priceMissing?'—':money(sum('cost')):'—']];
  stats.forEach(([label,value],i)=>{const item=add(root,'div','summary-item');add(item,'div','summary-label',label);const metric=add(item,'div','summary-value',value);if(i===1&&data)metric.title=fmt(sum('total'))+' tokens';});
}
function renderCredentials(credentials){
  const root=$('credential-table');root.replaceChildren();$('credential-count').textContent=(data?fmt(credentials.length):'—')+' 个凭证';
  if(!data){root.append(noData());return;}
  if(!credentials.length){root.append(empty('近 7 天暂无凭证请求','当前筛选下还没有观测到请求事件。新请求会在下次快照同步后显示。'));return;}
  const tbody=makeTable(root,'近 7 天凭证用量及模型', [['凭证','',19],['模型','',21],['请求','num',10],['输入','num',9],['输出','num',9],['缓存读取','num',10],['总 tokens','num',11],['估算 USD','num',11]]);
  credentials.forEach((s,i)=>{
    const tr=add(tbody,'tr','');const label=addCell(tr,'');const button=add(label,'button','credential-button');button.type='button';button.id='credential-toggle-'+i;button.setAttribute('aria-expanded',String(expanded===s.auth_id));button.setAttribute('aria-controls','credential-detail-'+i);
    add(button,'span','chevron',expanded===s.auth_id?'⌄':'›').setAttribute('aria-hidden','true');add(button,'span','credential-name',credentialName(s));add(label,'span','cell-secondary',providerName(s.provider));
    const models=list(s.models);const modelcell=addCell(tr,'');[...new Set(models.map(m=>modelName(m.model)))].forEach(model=>add(modelcell,'div','model',model));if(!models.length)add(modelcell,'span','model','未知模型');
    const requests=addCell(tr,fmt(s.requests),'num');add(requests,'span','cell-secondary'+(s.failures?' failure-count':''),fmt(s.failures||0)+' 次失败');
    ['input','output','cached','total'].forEach(field=>addTokens(tr,'td','num',s[field],''));const cost=addCell(tr,money(s.missing_price?null:s.cost),'num usd-value');if(s.missing_price||s.cost==null)add(cost,'span','cell-secondary','价格缺失');
    button.onclick=()=>{expanded=expanded===s.auth_id?'':s.auth_id;renderRequests();$(button.id)?.focus({preventScroll:true});};
    const detailtr=add(tbody,'tr','');detailtr.id='credential-detail-'+i;detailtr.hidden=expanded!==s.auth_id;
    if(expanded===s.auth_id){
      const cell=add(detailtr,'td','details-cell');cell.colSpan=8;const detail=add(cell,'div','details');add(detail,'h3','','各模型观测用量 · 近 7 天');
      if(!models.length)add(detail,'p','muted','暂无模型明细。');
      models.forEach(m=>{const row=add(detail,'div','modelrow');add(row,'span','model',modelName(m.model));const stats=add(row,'span','tabnum',fmt(m.requests)+' 次请求 · '+tokens(m.tokens)+' tokens · '+money(m.cost));stats.title=fmt(m.tokens)+' tokens';});
    }
  });
}
function recentRequests(){
  const credentials=list(data?.credentials),quotas=list(data?.quotas);
  return list(data?.recent).slice(0,60).filter(x=>active({provider:x.provider||credentials.find(s=>s.auth_id===x.auth_id)?.provider||quotas.find(s=>s.auth_id===x.auth_id)?.provider}));
}
function renderRecent(){
  const root=$('recent-table');root.replaceChildren();const recent=recentRequests();const pages=Math.ceil(recent.length/pageSize);recentPage=Math.max(0,Math.min(recentPage,pages-1));
  const start=recentPage*pageSize, shown=recent.slice(start,start+pageSize);
  $('recent-prev').disabled=!data||recentPage===0;$('recent-next').disabled=!data||recentPage>=pages-1;$('recent-page').textContent=(pages?recentPage+1:0)+' / '+pages;
  $('recent-caption').textContent=data?(recent.length?'显示 '+(start+1)+'–'+(start+shown.length)+' / '+recent.length+' 条':'暂无近期记录'):'等待请求快照';
  if(!data){root.append(noData());return;}
  if(!recent.length){root.append(empty('暂无近期请求','当前快照最多包含最近 60 条；当前筛选无匹配记录，不代表没有历史请求。'));return;}
  const tbody=makeTable(root,'最近最多 60 条请求快照', [['时间','',14],['凭证','',16],['模型','',21],['输入','num',8],['输出','num',8],['缓存 读 / 写','num',12],['总 tokens','num',12],['状态','',9]]);
  shown.forEach(x=>{
    const tr=add(tbody,'tr','');const timecell=addCell(tr,'','timestamp');const time=add(timecell,'time','',clock(x.at));if(x.at)time.dateTime=x.at;time.title=when(x.at);const date=new Date(x.at);add(timecell,'span','cell-secondary',Number.isFinite(date.getTime())?date.toLocaleDateString('zh-CN'):'未知日期');
    const credential=list(data.credentials).find(s=>s.auth_id===x.auth_id)||list(data.quotas).find(s=>s.auth_id===x.auth_id)||{auth_id:x.auth_id};
    const label=addCell(tr,credentialName(credential));add(label,'span','cell-secondary',providerName(x.provider||credential.provider));addCell(tr,modelName(x.model),'model');
    ['input','output'].forEach(field=>addTokens(tr,'td','num',x[field],''));const cache=addCell(tr,'','num cache-pair');addTokens(cache,'span','',x.cache_read,'');add(cache,'span','slash','/');addTokens(cache,'span','',x.cache_write,'');
    addTokens(tr,'td','num',x.total,'');const state=addCell(tr,'');add(state,'span','request-state'+(x.failed?' failed':''),x.failed?'失败':'成功');
  });
}
function renderRequests(){const credentials=list(data?.credentials).filter(active);renderSummary(credentials);renderRecent();renderCredentials(credentials);$('request-count').textContent=data?fmt(credentials.reduce((n,s)=>n+(Number(s.requests)||0),0)):'—';}
function restoreFocus(id){if(id&&$(id)&&document.activeElement?.id!==id)$(id).focus({preventScroll:true});}
function render(){
  const focused=document.activeElement?.id;
  renderQuotas();renderRequests();updateSyncInfo();
  quotaStamp=quotaContent(data);requestStamp=requestContent(data);
  restoreFocus(focused);
}
function setTab(selected){
  tab=selected==='requests'?'requests':'quota';
  ['quota','requests'].forEach(name=>{const selected=tab===name;$('tab-'+name).setAttribute('aria-selected',String(selected));$('tab-'+name).tabIndex=selected?0:-1;$('page-'+name).classList.toggle('hide',!selected);});
}
['quota','requests'].forEach(name=>{
  $('tab-'+name).onclick=()=>setTab(name);
  $('tab-'+name).addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();setTab(e.key==='Home'?'quota':e.key==='End'?'requests':tab==='quota'?'requests':'quota');$('tab-'+tab).focus();});
});
$('provider').onchange=e=>{filter=e.target.value;recentPage=0;expanded='';render();};
$('recent-prev').onclick=()=>{recentPage--;renderRecent();};$('recent-next').onclick=()=>{recentPage++;renderRecent();};
$('refresh').onclick=()=>load(true);
window.addEventListener('storage',()=>load());
window.addEventListener('focus',()=>{if(!loading&&Date.now()-lastSyncAt>=60000)load();});
load();
setInterval(()=>{if(!document.hidden&&!loading)load();},60000);
setInterval(()=>{if(!document.hidden&&data)updateCountdowns();},30000);
})();

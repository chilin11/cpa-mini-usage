<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>用量与额度 · CPA Mini Usage</title>
<style>
/* Compact telemetry console: official quota in cyan, forecasts in cool blue,
   observed cost in slate, Claude identity in amber. System fonts; no motion.
   Surface rhythm: 4/8/12/16/24px; 8px controls, 12px cards. Keep metrics primary,
   quiet chrome, visible focus, internal table scrolling and immediate feedback. */
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;--bg:#eef3f9;--panel:#ffffff;--subtle:#f5f8fc;--ink:#18283e;--muted:#53677f;--line:#d8e2ed;--edge:#b9ccde;--accent:#086f98;--accent-blue:#286ad6;--accent-soft:#e7f3fc;--forecast:#285cb0;--forecast-soft:#eaf1fc;--cost:#354a63;--track:#dce6f0;--good:#16745b;--good-soft:#e6f5ef;--bad:#b33546;--bad-soft:#fff0f2;--warm:#92550d;--warm-soft:#fff1dd;--hover:#f0f6fc;--grid:rgba(41,81,128,.04);--glow:rgba(61,140,228,.09);--shadow:0 2px 8px rgba(26,52,84,.035),0 12px 32px rgba(26,52,84,.025);--radius:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0a111c;--panel:#111d2c;--subtle:#0e1826;--ink:#e6eefb;--muted:#9cacc2;--line:#293b50;--edge:#3b536e;--accent:#62d5f3;--accent-blue:#6096ff;--accent-soft:#142e43;--forecast:#93baff;--forecast-soft:#192b45;--cost:#c7d4e6;--track:#25364a;--good:#78dbb5;--good-soft:#152f2c;--bad:#ffa0ac;--bad-soft:#34202c;--warm:#efba75;--warm-soft:#30271f;--hover:#18283b;--grid:rgba(123,160,201,.035);--glow:rgba(39,108,191,.12);--shadow:0 2px 8px rgba(0,0,0,.12),0 16px 36px rgba(0,0,0,.08)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(ellipse at 8% 0,var(--glow),transparent 58%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100% 640px,40px 40px,40px 40px;background-repeat:no-repeat,repeat,repeat;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.4}
h2{font-size:14px;font-weight:650;letter-spacing:-.15px}
h3{font-size:13px;font-weight:600}
button,select,input{font:inherit}
button,a,select,input{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled,select:disabled{color:var(--muted);background:var(--subtle);border-color:var(--line);cursor:default}
a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex="0"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hide,[hidden]{display:none!important}
.muted{color:var(--muted)}
.tabnum{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
main{max-width:1180px;margin:auto;padding:24px}
main.request-view{max-width:1480px}
.masthead{display:flex;align-items:center;justify-content:flex-start;gap:16px;flex-wrap:wrap;padding:0 0 0 12px;border-left:3px solid var(--accent)}
.masthead>div{min-width:0;overflow-wrap:anywhere}
.brandline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.3px;color:var(--muted);margin-bottom:4px}
.brandline>span:first-child{color:var(--accent)}
.version{font-size:11px;line-height:1.6;letter-spacing:0;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--panel)}
.header-actions{display:flex;align-items:center;gap:12px;min-width:0}
.statusbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.dot{width:6px;height:6px;flex-shrink:0;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.dot.busy{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;border:1px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:550;min-height:34px;overflow-wrap:anywhere;box-shadow:0 1px 2px var(--glow)}
.button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.button:active:not(:disabled){background:var(--track);border-color:var(--accent)}
.button svg{width:14px;height:14px;flex-shrink:0}
#refresh:not(:disabled){color:var(--accent);background:var(--accent-soft);border-color:var(--edge)}
#refresh:hover:not(:disabled){border-color:var(--accent)}
#refresh:active:not(:disabled){background:var(--track)}
.gate{margin-top:20px;padding:20px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:24px}
.gate>div{min-width:0;overflow-wrap:anywhere}
.gate h2{font-size:14px}
.gate p{font-size:12px;line-height:1.7;color:var(--muted);margin-top:4px;max-width:68ch}
.gate a{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;white-space:nowrap;font-size:12px;font-weight:600;min-height:34px;padding:6px 12px;border:1px solid var(--edge);border-radius:8px;background:var(--accent-soft);text-decoration:none}
.gate a:hover{border-color:var(--accent)}
.gate a:active{background:var(--track)}
.alert{margin-top:16px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:8px;font-size:12px;color:var(--bad);overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:20px}
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 14px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;margin-bottom:-1px;color:var(--muted);font-size:13px}
.tabs button:hover{color:var(--ink);background:var(--subtle)}
.tabs button:active{background:var(--track)}
.tabs button[aria-selected=true]{color:var(--accent);background:var(--accent-soft);border-bottom-color:var(--accent);font-weight:650;box-shadow:inset 0 1px 0 var(--panel)}
.tab-count{display:inline-block;min-width:24px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected=true] .tab-count{color:var(--accent);border-color:var(--edge)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 20px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--subtle);box-shadow:inset 0 1px 0 var(--panel)}
.toolbar-options{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;max-width:100%}
.toolbar .header-actions{flex-wrap:wrap;justify-content:flex-start;width:auto;gap:10px}
.toolbar .toolbar-options{gap:12px}
.toolbar .statusbar{font-size:11px}
.filter-control{display:flex;align-items:center;gap:8px;min-width:0}
.filter-control label{display:none}
select{max-width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12px;min-height:32px;cursor:pointer}
select:hover:not(:disabled){border-color:var(--edge)}
.language-control{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-width:0}
.persistence-control{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);min-width:0;max-width:100%;overflow-wrap:anywhere}
.persistence-label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.persistence-label input{width:14px;height:14px;margin:0;accent-color:var(--accent);cursor:pointer}
.persistence-label input:disabled{cursor:default}
.persistence-label input:disabled+span{color:var(--muted)}
.persistence-label input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.persistence-error{color:var(--bad);overflow-wrap:anywhere}
.results{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h2{min-width:0;overflow-wrap:anywhere}
.section-label{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.provider-section{grid-column:1/-1;min-width:0;--provider-accent:var(--accent)}
.provider-section[data-provider=claude]{--provider-accent:var(--warm)}
.provider-section+.provider-section{margin-top:12px}
.provider-section>.section-head h2{display:flex;align-items:center;gap:8px}
.provider-section>.section-head h2::before{content:"";width:3px;height:14px;flex-shrink:0;background:var(--provider-accent);border-radius:2px}
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-top-color:var(--edge);border-radius:var(--radius);box-shadow:var(--shadow)}
.accounttop{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);border-radius:11px 11px 0 0;background:linear-gradient(110deg,var(--subtle),var(--panel));box-shadow:inset 0 2px 0 var(--provider-accent)}
.identity{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 160px}
.account-icon{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:13px;font-weight:650;flex-shrink:0}
.account-icon.claude{color:var(--warm);background:var(--warm-soft)}
.identity-text{min-width:0}
.account{font-size:13px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.account-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px 12px;flex-wrap:wrap;min-width:0;max-width:100%;margin-left:auto}
.manual-reset{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.manual-reset strong{font-size:18px;font-weight:750;line-height:1.2;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.account-refresh{padding:4px 8px;min-height:28px;font-size:11px;font-weight:500;border-color:var(--line)}
.button[aria-busy=true]{cursor:progress;border-style:dashed;box-shadow:none}
.button:disabled{box-shadow:none}
.windows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.window{display:flex;flex-direction:column;padding:12px 16px;min-width:0}
.window+.window{border-left:1px solid var(--line)}
.windowhead h3{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.quota-value{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:4px}
.percent{font-size:26px;color:var(--accent);letter-spacing:-1px;font-weight:700;line-height:1.25;font-family:var(--mono);font-variant-numeric:tabular-nums}
.percent-unit{font-size:14px;font-weight:500;letter-spacing:0;margin-left:2px}
.remaining-label{font-size:11px;color:var(--muted)}
.low .percent{color:var(--bad)}
.track{height:4px;flex-shrink:0;border-radius:3px;background:var(--track);margin:8px 0 12px}
.fill{height:100%;background:linear-gradient(90deg,var(--accent-blue),var(--accent));border-radius:3px}
.low .fill{background:var(--bad)}
.unknown .percent{color:var(--muted)}
.windowstats{margin:0 0 12px;padding:8px 0;border:0;border-radius:6px;background:linear-gradient(90deg,transparent calc(50% + 4px),var(--forecast-soft) calc(50% + 4px));min-width:0}
.usage-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:baseline}
.usage-row>*{min-width:0}
.usage-row>:nth-child(2){padding-left:8px;padding-right:4px}
.usage-label{font-size:11px;color:var(--muted);margin-bottom:4px;overflow-wrap:anywhere}
.usage-label:nth-child(2){color:var(--forecast)}
.observed-cost{font-size:17px;font-weight:600;letter-spacing:-.5px;line-height:1.35;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--cost);overflow-wrap:anywhere}
.estimate-cost{display:flex;align-items:baseline;gap:6px;font-size:17px;font-weight:600;letter-spacing:-.5px;line-height:1.35;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--forecast);overflow-wrap:anywhere}
.estimate-cost .unit{font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted)}
.usage-row .estimate-cost{display:block;overflow-wrap:anywhere}
.observed-value{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.5;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.35px;overflow-wrap:anywhere}
.estimate-value{font-size:14px;color:var(--forecast);margin-top:2px;line-height:1.5;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.35px;overflow-wrap:anywhere}
.reset{font-size:11px;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.account-error{margin:12px 16px 0;padding:8px 10px;border-left:2px solid var(--bad);border-radius:4px;background:var(--bad-soft);font-size:11px;color:var(--bad);overflow-wrap:anywhere}
.account-error:empty{display:none}
.account-note{margin:12px 16px 0;padding:8px 10px;border-left:2px solid var(--good);border-radius:4px;background:var(--good-soft);font-size:11px;color:var(--good);overflow-wrap:anywhere}
.account-note:empty{display:none}
.account-state{display:inline-block;margin-top:2px;padding:0 6px;border:1px solid var(--warm);border-radius:4px;background:var(--warm-soft);color:var(--warm);font-size:11px;font-weight:600;line-height:1.6}
.panel.account-disabled .windows{opacity:.55}
.account-action{padding:4px 8px;min-height:28px;font-size:11px;font-weight:500;border-color:var(--line)}
.account-reset:not(:disabled){color:var(--accent);border-color:var(--edge)}
.account-switch{display:inline-flex;align-items:center;flex-shrink:0;min-height:28px;padding:0 2px;border:0;border-radius:11px;background:transparent}
.account-switch:disabled{background:transparent;cursor:default}
.switch-track{position:relative;display:block;width:36px;height:20px;box-sizing:border-box;border:1px solid var(--edge);border-radius:10px;background:var(--track)}
.switch-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.account-switch[aria-checked=true] .switch-track{border-color:var(--good);background:var(--good)}
.account-switch[aria-checked=true] .switch-thumb{left:18px}
.account-switch:hover:not(:disabled) .switch-track{border-color:var(--accent)}
.account-switch[aria-checked=true]:hover:not(:disabled) .switch-track{border-color:var(--good)}
.account-switch[aria-busy=true]{cursor:progress}
.account-switch[aria-busy=true] .switch-track{border-style:dashed;opacity:.7}
.account-action.armed:not(:disabled){color:var(--bad);border-color:var(--bad);background:var(--bad-soft);font-weight:650}
.empty{grid-column:1/-1;min-width:0;padding:32px 20px;border:1px dashed var(--edge);border-radius:var(--radius);background:var(--panel);text-align:center;color:var(--muted);overflow-wrap:anywhere}
.empty-symbol{display:none}
.empty strong{font-size:13px;font-weight:600;color:var(--ink)}
.empty p{font-size:12px;line-height:1.7;margin:6px auto 0;max-width:64ch}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-top-color:var(--edge);background:var(--panel);border-radius:var(--radius);padding:12px 0;margin-bottom:20px;box-shadow:var(--shadow)}
.summary-item{display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:0 16px;min-width:0}
.summary-item+.summary-item{border-left:1px solid var(--line)}
.summary-label{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.summary-value{font-size:20px;font-weight:650;line-height:1.4;letter-spacing:-.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.summary-item:first-child .summary-value{color:var(--accent)}
.summary-item:nth-child(2) .summary-value{font-size:18px}
.summary-item:nth-child(4) .summary-value{font-size:17px;color:var(--cost)}
.summary-note{display:none}
.request-section{min-width:0}
.request-section+.request-section{margin-top:20px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);scrollbar-color:var(--edge) var(--subtle);overscroll-behavior-x:contain;box-shadow:var(--shadow)}
.tablewrap{max-width:100%;min-width:0}
.tablewrap .empty{border:0;border-radius:0}
#page-requests{min-width:0}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:990px;font-size:12px}
th{font-size:11px;color:var(--muted);font-weight:600;line-height:1.5;text-align:left;padding:10px 12px;background:var(--subtle)}
td{padding:10px 12px;border-top:1px solid var(--line);overflow-wrap:anywhere;vertical-align:middle;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right;white-space:nowrap}
td.num{font-family:var(--mono);font-size:11px;letter-spacing:-.2px;white-space:normal}
tbody tr:nth-child(even)>td{background:var(--subtle)}
tbody tr:has(.credential-button[aria-expanded=true])>td{background:var(--accent-soft)}
tbody tr:hover>td{background:var(--hover)}
tbody tr:focus-within>td{background:var(--hover)}
.usd-value,td.usd-value{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--cost)}
.timestamp{font-family:var(--mono);font-size:11px;color:var(--cost)}
.cell-secondary{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
.model{font-family:var(--mono);font-size:11px;color:var(--ink)}
.model+.model{margin-top:4px}
.model-observation{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}
.model-observation .model{font-size:11px;color:inherit}
.model-response{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px}
.model-response .model-badge{margin-top:0}
.model-badge{display:inline-block;margin-top:3px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;font:500 10px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);background:var(--subtle)}
.model-badge.same{color:var(--good);background:var(--good-soft)}
.model-badge.variant{color:var(--cost)}
.model-badge.different{color:var(--warm);background:var(--warm-soft);border-color:var(--warm);border-radius:3px;padding:0 4px}
.request-state{display:inline-block;padding:2px 5px;border-radius:4px;font-size:10px;font-weight:600;color:var(--good);background:var(--good-soft)}
.request-state.failed{color:var(--bad);background:var(--bad-soft)}
.failure-count{color:var(--bad)}
.cache-pair .slash{padding:0 3px;color:var(--muted)}
.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);margin-top:10px}
.table-foot>span{min-width:0;overflow-wrap:anywhere}
.pagination{display:flex;align-items:center;gap:8px}
.pagination .button{padding:3px 9px;min-height:28px;min-width:28px;font-size:14px}
.pagination .button:disabled{color:var(--muted);border-color:var(--line);background:var(--subtle)}
.pagination .tabnum{min-width:40px;text-align:center;font-size:11px}
.credential-button{display:flex;align-items:baseline;gap:6px;background:none;border:0;border-radius:3px;padding:2px 0;text-align:left;color:var(--ink);font:inherit;font-weight:550;width:100%}
.credential-button:hover,.credential-button[aria-expanded=true]{color:var(--accent)}
.credential-button:active{color:var(--accent-blue)}
.chevron{color:var(--muted);font-family:var(--mono);flex-shrink:0}
.credential-button[aria-expanded=true] .chevron{color:var(--accent)}
.credential-name{min-width:0;overflow-wrap:anywhere}
.details-cell{background:var(--subtle);padding:0 16px}
.details{padding:12px 0}
.details h3{font-size:11px;color:var(--muted);margin-bottom:8px}
.modelrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:11px;overflow-wrap:anywhere}
.modelrow .tabnum{text-align:right;color:var(--cost)}
.foot{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
#recent-table table{min-width:1220px}
#credential-table table{min-width:1120px}
#recent-table th,#recent-table td{padding-left:10px;padding-right:10px}
.request-view #page-requests th,.request-view #page-requests td{padding:7px 8px}
.request-view .summary{padding:12px 0;margin-bottom:16px}
.request-view .request-section+.request-section{margin-top:16px}
.request-view .table-foot,.request-view .pagination{flex-wrap:wrap}
.page-size-control{display:flex;align-items:center;gap:6px}
.page-size-control select{min-height:28px;padding:3px 6px;font-family:var(--mono);font-size:11px}
.timing-unit{display:block;font-size:10px;line-height:1.5;color:var(--muted);font-weight:400}
.request-timing .timing-line{display:block;font-size:11px;line-height:1.5}
.request-timing .timing-label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:10px;color:var(--muted);margin-right:5px;letter-spacing:0}
@media(max-width:1024px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){main{padding:20px 16px}.grid{grid-template-columns:minmax(0,1fr)}.masthead{gap:12px;flex-wrap:wrap}.header-actions{gap:8px;flex-wrap:wrap}.statusbar{display:none}.toolbar{margin-bottom:16px}.results{font-size:10px;text-align:left;flex-basis:100%}.accounttop{padding:12px 14px;flex-wrap:wrap}.window{padding:12px 14px}.summary,.request-view .summary{grid-template-columns:repeat(2,minmax(0,1fr));padding:0}.summary-item{padding:12px 14px}.summary-item:nth-child(3){border-left:0}.summary-item:nth-child(n+3){border-top:1px solid var(--line)}.gate{display:block;padding:16px}.gate a{display:inline-flex;margin-top:12px}.table-foot>span{max-width:100%}.table-foot,.pagination{flex-wrap:wrap}}
@media(max-width:480px){.windows{grid-template-columns:minmax(0,1fr)}.window+.window{border-left:0;border-top:1px solid var(--line)}main{padding:16px 12px}h1{font-size:20px}.tabs{gap:4px}.tabs button{padding:10px}.toolbar-options{width:100%}.identity{flex-basis:100%}.account-actions{width:100%;justify-content:flex-start;margin-left:0}.manual-reset{margin-right:auto}.account-error,.account-note{margin-left:14px;margin-right:14px}.section-head{gap:8px}.summary-item{padding:12px}.pagination{gap:6px}}
@media(max-width:380px){.window{padding:12px}.results{max-width:100%}.header-actions{width:100%;justify-content:flex-start}.account-actions{flex-wrap:wrap}.toolbar{padding:10px}.tabs button{padding:10px 8px}}
.needs-login .tabs,.needs-login [role=tabpanel],.needs-login .foot,.needs-login .filter-control,.needs-login .persistence-control,.needs-login #refresh,.needs-login .statusbar,.needs-login #updated{display:none}

</div><span id="updated" class="results" aria-live="polite">等待同步</span></div>
<section id="page-quota" role="tabpanel" aria-labelledby="tab-quota" tabindex="0">

</section>
<section id="page-requests" role="tabpanel" aria-labelledby="tab-requests" tabindex="0" class="hide">
  <div id="request-summary" class="summary" aria-label="近 7 天观测统计"></div>
  <section class="request-section" aria-labelledby="recent-title">
    <div class="section-head"><h2 id="recent-title" data-i18n="近期请求">近期请求</h2><span class="section-label" data-i18n="最多 60 条">最多 60 条</span></div>

    <div class="table-foot"><span id="recent-caption">等待请求快照</span><nav class="pagination" aria-label="近期请求分页"><label class="page-size-control" for="recent-size"><span data-i18n="每页">每页</span><select id="recent-size" aria-label="每页请求数"><option value="20">20</option><option value="40">40</option><option value="60">60</option></select></label><button class="button" type="button" id="recent-prev" aria-label="上一页" disabled>‹</button><span id="recent-page" class="tabnum">0 / 0</span><button class="button" type="button" id="recent-next" aria-label="下一页" disabled>›</button></nav></div>

  </section>
</section>
<footer class="foot" id="footer" data-i18n="页面每分钟同步 · 额度每 15 分钟检查">页面每分钟同步 · 额度每 15 分钟检查</footer>
</main>

  line.setAttribute('aria-label',t('响应模型')+': '+(response||t('未提供')));const badge=add(line,'span','model-badge '+status,labels[status]);badge.title=cell.title;
}
function renderRecent(){
  const root=$('recent-table');root.replaceChildren();const recent=recentRequests();const pages=Math.ceil(recent.length/pageSize);recentPage=Math.max(0,Math.min(recentPage,pages-1));
  const start=recentPage*pageSize, shown=recent.slice(start,start+pageSize);
  $('recent-prev').disabled=!data||recentPage===0;$('recent-next').disabled=!data||recentPage>=pages-1;$('recent-page').textContent=(pages?recentPage+1:0)+' / '+pages;
  $('recent-caption').textContent=data?(recent.length?t('显示 {start}–{end} / {n} 条',{start:start+1,end:start+shown.length,n:recent.length}):t('暂无近期记录')):t('等待请求快照');
  if(!data){root.append(noData());return;}
  if(!recent.length){root.append(empty('暂无近期请求','当前快照最多包含最近 60 条；当前筛选无匹配记录，不代表没有历史请求。'));return;}
  const tbody=makeTable(root,'最近最多 60 条请求快照', [['请求时间','',11],['凭证','',13],['模型','',14],['总输入','num',8],['输出','num',7],['缓存 读 / 写','num',10],['总 token','num',8],['金额','num',9],['时间','num',10],['TPS','num',8],['状态','',6]]);
  shown.forEach(x=>{
    const tr=add(tbody,'tr','');const timecell=addCell(tr,'','timestamp');const time=add(timecell,'time','',clock(x.at));if(x.at)time.dateTime=x.at;time.title=when(x.at);const date=new Date(x.at);add(timecell,'span','cell-secondary',Number.isFinite(date.getTime())?date.toLocaleDateString(locale()):'未知日期');
    const credential=list(data.credentials).find(s=>s.auth_id===x.auth_id)||list(data.quotas).find(s=>s.auth_id===x.auth_id)||{auth_id:x.auth_id};
    const label=addCell(tr,credentialName(credential),'credential-name');add(label,'span','cell-secondary',providerName(x.provider||credential.provider));addRequestModel(tr,x);
    addInputCell(tr,x,x.provider||credential.provider);addTokens(tr,'td','num',x.output,'');addCacheCell(tr,x.cache_read,x.cache_write);
    addTokens(tr,'td','num',x.total,'');const costValue=x.missing_price?null:validEstimate(x.cost),costCell=addCell(tr,requestMoney(costValue),'num usd-value request-cost');costCell.title=costValue==null?t(x.usage_quality==='unclassified'||x.usage_quality==='inconsistent'?'用量分桶不完整或不一致，金额暂不可用':'缺少模型单价，金额暂不可用'):'$'+String(costValue)+' USD\n'+t('按当前模型单价计算的 API 等价金额，不是订阅扣款。')+'\n'+t('按标准 API 价格比较，包含适用的长上下文档位；不是订阅扣款。');
    addRequestTiming(tr,x);const state=addCell(tr,'');add(state,'span','request-state'+(x.failed?' failed':''),x.failed?'失败':'成功');
  });
}
function renderRequests(){const credentials=list(data?.credentials).filter(active);renderSummary(credentials);renderRecent();renderCredentials(credentials);$('request-count').textContent=data?fmt(credentials.reduce((n,s)=>n+(Number(s.requests)||0),0)):'—';}
function restoreFocus(id){if(id&&$(id)&&document.activeElement?.id!==id)$(id).focus({preventScroll:true});}
function render(){
  const focused=document.activeElement?.id;
  renderQuotas();renderRequests();updateSyncInfo();updatePersistence();
  quotaStamp=quotaContent(data);requestStamp=requestContent(data);
  restoreFocus(focused);
}
function setTab(selected){
  tab=selected==='requests'?'requests':'quota';
  ['quota','requests'].forEach(name=>{const selected=tab===name;$('tab-'+name).setAttribute('aria-selected',String(selected));$('tab-'+name).tabIndex=selected?0:-1;$('page-'+name).classList.toggle('hide',!selected);});
  $('dashboard').classList.toggle('request-view',tab==='requests');syncHeader();updateSyncInfo();
}
['quota','requests'].forEach(name=>{
  $('tab-'+name).onclick=()=>setTab(name);
  $('tab-'+name).addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();setTab(e.key==='Home'?'quota':e.key==='End'?'requests':tab==='quota'?'requests':'quota');$('tab-'+tab).focus();});
});
$('provider').onchange=e=>{filter=e.target.value;recentPage=0;expanded='';render();};
$('recent-prev').onclick=()=>{recentPage--;renderRecent();};$('recent-next').onclick=()=>{recentPage++;renderRecent();};
$('recent-size').value=String(pageSize);$('recent-size').onchange=e=>{const size=Number(e.target.value);pageSize=[20,40,60].includes(size)?size:20;$('recent-size').value=String(pageSize);recentPage=0;renderRecent();};
$('refresh').onclick=()=>tab==='requests'?refreshRequests():load(true);
$('language').onchange=e=>setLanguage(e.target.value);
$('persistence-enabled').onchange=e=>savePersistence(e.target.checked);
window.addEventListener('storage',e=>{if(e.key===languageStorage){setLanguage(initialLanguage(),false);return;}load();});
window.addEventListener('focus',()=>{if(!loading&&!accountJobs.size&&Date.now()-lastSyncAt>=60000)load();});
applyLanguage();
load();
setInterval(()=>{if(!document.hidden&&!loading&&!accountJobs.size)load();},60000);
setInterval(()=>{if(!document.hidden&&data)updateCountdowns();},30000);
})();
</script>

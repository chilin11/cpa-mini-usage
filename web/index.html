<body>
<main id="dashboard">
<header class="masthead">
  <div>
    <div class="brandline"><span>CPA Mini Usage</span><span class="version">v0.1.5</span></div>
    <h1 data-i18n="用量与额度">用量与额度</h1>
  </div>
  <div class="header-actions">
    <label class="language-control"><span data-i18n="语言">语言</span><select id="language" aria-label="语言"><option value="zh" data-i18n="中文">中文</option><option value="en" data-i18n="英语">英语</option></select></label>
    <div class="statusbar" role="status"><span class="dot off" id="dot" aria-hidden="true"></span><span id="status">正在读取登录状态</span></div>
    <button class="button" id="refresh" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .2 5M16 3v4h-4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="refresh-label">刷新全部</span></button>
  </div>
</header>
<section id="gate" class="gate hide" aria-labelledby="gate-title"><div><h2 id="gate-title" data-i18n="需要 CPA 登录">需要 CPA 登录</h2><p data-i18n="请在同源 CPA 管理页面登录并勾选“记住密码”。插件不支持复用跨域或未保存的登录。">请在同源 CPA 管理页面登录并勾选“记住密码”。插件不支持复用跨域或未保存的登录。</p></div><a href="/management.html" target="_top" data-i18n="前往 CPA 登录 ↗">前往 CPA 登录 ↗</a></section>
<div id="alert" class="alert hide" role="status" aria-live="polite"></div>
<div class="tabs" role="tablist" aria-label="用量视图">
  <button id="tab-quota" type="button" role="tab" aria-controls="page-quota" aria-selected="true" tabindex="0"><span data-i18n="剩余额度">剩余额度</span> <span class="tab-count" id="quota-count">—</span></button>
  <button id="tab-requests" type="button" role="tab" aria-controls="page-requests" aria-selected="false" tabindex="-1"><span data-i18n="请求明细">请求明细</span> <span class="tab-count" id="request-count">—</span></button>
</div>
<div class="toolbar"><div class="toolbar-options"><div class="filter-control"><label for="provider" data-i18n="服务商">服务商</label><select id="provider" aria-label="筛选服务商"><option value="" data-i18n="全部服务商">全部服务商</option><option value="claude">Claude</option><option value="codex">Codex</option></select></div><div class="persistence-control" id="persistence-control"><label class="persistence-label" for="persistence-enabled"><input id="persistence-enabled" type="checkbox" aria-label="保存数据" disabled><span data-i18n="保存数据">保存数据</span></label><span id="persistence-status" role="status" aria-live="polite">—</span></div></div><span id="updated" class="results" aria-live="polite">等待同步</span></div>
<section id="page-quota" role="tabpanel" aria-labelledby="tab-quota" tabindex="0">
  <div id="quota-cards" class="grid"><div class="empty"><strong>正在读取 CPA 登录状态…</strong></div></div>
</section>
<section id="page-requests" role="tabpanel" aria-labelledby="tab-requests" tabindex="0" class="hide">
  <div id="request-summary" class="summary" aria-label="近 7 天观测统计"></div>
  <section class="request-section" aria-labelledby="recent-title">
    <div class="section-head"><h2 id="recent-title" data-i18n="近期请求">近期请求</h2><span class="section-label" data-i18n="最多 60 条">最多 60 条</span></div>
    <div id="recent-table" class="tablewrap" role="region" aria-label="近期请求表，窄屏可横向滚动" tabindex="0"></div>
    <div class="table-foot"><span id="recent-caption">等待请求快照</span><nav class="pagination" aria-label="近期请求分页"><label class="page-size-control" for="recent-size"><span data-i18n="每页">每页</span><select id="recent-size" aria-label="每页请求数"><option value="20">20</option><option value="40">40</option><option value="60">60</option></select></label><button class="button" type="button" id="recent-prev" aria-label="上一页" disabled>‹</button><span id="recent-page" class="tabnum">0 / 0</span><button class="button" type="button" id="recent-next" aria-label="下一页" disabled>›</button></nav></div>
  </section>
  <section class="request-section" aria-labelledby="credentials-title">
    <div class="section-head"><h2 id="credentials-title" data-i18n="凭证用量 · 近 7 天">凭证用量 · 近 7 天</h2><span id="credential-count" class="section-label">— 个凭证</span></div>
    <div id="credential-table" class="tablewrap" role="region" aria-label="凭证用量表，窄屏可横向滚动" tabindex="0"><div class="empty">等待同步</div></div>
  </section>
</section>
<footer class="foot" id="footer" data-i18n="页面每分钟同步 · 额度每 15 分钟检查">页面每分钟同步 · 额度每 15 分钟检查</footer>
</main>

    const issues=[snapshot.storage_error&&errorKey(snapshot.storage_error,'存储读取失败。'),snapshot.price_error&&errorKey(snapshot.price_error,'价格读取失败。')].filter(Boolean);setAlert(issues);
  }catch(err){
    if(await authChanged())return;
    if(err.auth){++loadSerial;loading=false;clearSnapshot(true,err.ui);syncControls();}else{requestStatusKey='请求同步失败';setAlert(err.ui||errorKey(err.message));}
  }finally{if(requestJob===job){requestJob=null;syncHeader();updateSyncInfo();$('page-requests').setAttribute('aria-busy',String(loading));}}
}
function showAccountError(id,value){
  if(value)accountErrors.set(id,value);else accountErrors.delete(id);
  const entry=cardCache.get(id);if(entry){entry.error.textContent=value?message(value):entry.backendError?message(errorKey(entry.backendError,'账户额度刷新失败，请稍后重试。')):'';entry.error.hidden=!entry.error.textContent;}
}
async function refreshAccount(id){
  if(typeof id!=='string'||!id.trim()){showAccountError(id,'无效的账户标识。');return;}
  if(key!==guessKey()){await load();return;}
  if(accountJob||loading||data?.quota_refreshing||remoteAccountBusy()){showAccountError(id,'已有额度刷新正在进行，请稍后重试。');return;}
  const job={id,key,serial:loadSerial};accountJob=job;showAccountError(id,null);syncAccountControls();
  const current=()=>accountJob===job&&loadSerial===job.serial;
  const authChanged=async()=>{if(guessKey()!==job.key){if(current()){accountJob=null;await load();}return true;}return !current();};
  try{
    const accepted=await api('refresh-account','POST',{auth_id:id});if(await authChanged())return;
    const baseline=accepted.refresh_finished_at,deadline=Date.now()+120000;
    while(Date.now()<deadline){
      await pause();if(await authChanged())return;
      const snapshot=await api('data');if(await authChanged())return;
      acceptSnapshot(validSnapshot(snapshot));lastSyncAt=Date.now();
      const state=snapshot.account_refresh?.[id];
      if(state&&!state.refreshing&&state.finished_at&&state.finished_at!==baseline){if(state.error)showAccountError(id,errorKey(state.error,'账户额度刷新失败，请稍后重试。'));return;}
    }
    showAccountError(id,'账户额度刷新超时，请稍后重试。');
  }catch(err){
    if(await authChanged())return;
    if(err.auth){++loadSerial;loading=false;clearSnapshot(true,err.ui);syncControls();}else showAccountError(id,err.ui||errorKey(err.message,'账户额度刷新失败，请稍后重试。'));
  }finally{if(accountJob===job){accountJob=null;syncAccountControls();}}
}
async function savePersistence(enabled){
  if(key!==guessKey()){await load();return;}
  if(settingsJob||loading||typeof data?.persistence?.enabled!=='boolean'){updatePersistence();return;}
  const job={key};settingsJob=job;settingsError=null;updatePersistence();
  const current=()=>settingsJob===job;
  const authChanged=async()=>{if(guessKey()!==job.key){if(current()){settingsJob=null;await load();}return true;}return !current();};
  try{
    const response=await api('settings','POST',{persistence_enabled:Boolean(enabled)});if(await authChanged())return;
    if(typeof response?.persistence?.enabled!=='boolean'||typeof response.persistence.directory!=='string')throw failure('无法保存设置，请稍后重试。');
    data={...data,persistence:response.persistence};
  }catch(err){
    if(await authChanged())return;
    if(err.auth){++loadSerial;loading=false;clearSnapshot(true,err.ui);syncControls();}else settingsError=err.ui||'无法保存设置，请稍后重试。';
  }finally{if(current()){settingsJob=null;updatePersistence();}}
}
function addWindow(parent,title,period,win){
  const remaining=remainingPercent(win);
  const section=add(parent,'section','window'+(remaining==null?' unknown':remaining<20?' low':''));
  const h=add(section,'div','windowhead');add(h,'h3','',title);
  const value=add(section,'div','quota-value');const percent=add(value,'span','percent',remaining==null?'—':remaining.toFixed(1));
  if(remaining!=null)add(percent,'span','percent-unit','%');add(value,'span','remaining-label',remaining==null?'额度未知':'剩余');
  const track=add(section,'div','track');track.setAttribute('role','meter');track.setAttribute('aria-label',t('{window}官方剩余额度',{window:t(title)}));track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');
  if(remaining!=null)track.setAttribute('aria-valuenow',String(remaining));track.setAttribute('aria-valuetext',remaining==null?t('未知'):t('{percent}% 剩余',{percent:remaining.toFixed(1)}));
  const fill=add(track,'div','fill');fill.style.width=(remaining??0)+'%';
  const cost=win?.missing_price?null:remainingEstimate(win?.estimated_total_cost,remaining);
  const stats=add(section,'div','windowstats');
  const amount=add(stats,'div','estimate-cost',money(cost));add(amount,'span','unit','美元估算');
  const available=remainingEstimate(win?.estimated_total_tokens,remaining);
  const tokenValue=addTokens(stats,'div','estimate-value',available);
  tokenValue.title+='\n'+t('观测：{observed} token\n剩余换算：观测 token ÷ {used}% × {remaining}%',{observed:fmt(win?.observed_tokens),used:win?.used_percent??'—',remaining:remaining??'—'});
  amount.title=t('观测成本：{cost}\n按已用比例换算剩余金额',{cost:money(win?.observed_cost)});
  const reset=add(section,'div','reset',resetCountdown(win?.reset_at));reset.title=when(win?.reset_at);if(win?.reset_at)reset.dataset.resetAt=win.reset_at;
  if(win?.missing_price)amount.title=t('缺少模型单价，金额暂不可用');
}
function renderQuotas(){
  const root=$('quota-cards'),quotas=list(data?.quotas).filter(active);$('quota-count').textContent=data?fmt(quotas.length):'—';
  if(!data||!quotas.length){root.replaceChildren(!data?noData():empty(filter?'此服务商暂无 OAuth 额度':'还没有可用的 OAuth 额度','请检查 Claude / Codex 凭证是否支持额度查询，或点击“刷新全部”重新检查。'));cardCache.clear();return;}
  const providers=[...new Set(quotas.map(q=>q.provider))].sort((a,b)=>a.localeCompare(b)),sections=[];
  const oldSections=new Map([...root.children].map(s=>[s.dataset.provider,s]));
  const present=new Set();
  providers.forEach(provider=>{
    const accounts=quotas.filter(q=>q.provider===provider);let section=oldSections.get(provider);
    if(!section){section=el('section','provider-section');section.dataset.provider=provider;const heading=add(section,'div','section-head');add(heading,'h2','',providerName(provider));add(heading,'span','section-label','');add(section,'div','grid');}
    section.children[0].children[1].textContent=t('{n} 个账户',{n:fmt(accounts.length)});const cards=section.children[1],panels=[];
    accounts.forEach((item,i)=>{
      const id=item.auth_id??provider+':'+i,stamp=accountContent(item);present.add(id);let entry=cardCache.get(id);
      if(!entry||entry.stamp!==stamp){
        const panel=el('article','panel');panel.dataset.authId=id;
        const head=add(panel,'div','accounttop'),identity=add(head,'div','identity');
        const icon=add(identity,'span','account-icon'+(item.provider==='claude'?' claude':''),item.provider==='claude'?'C':'⌘');icon.setAttribute('aria-hidden','true');
        const text=add(identity,'div','identity-text');add(text,'h3','account',credentialName(item));
        const actions=add(head,'div','account-actions');
        if(Number.isSafeInteger(item.manual_reset_remaining)&&item.manual_reset_remaining>=0){const resets=add(actions,'div','manual-reset');add(resets,'span','','可重置');add(resets,'strong','',fmt(item.manual_reset_remaining));if(language==='zh')add(resets,'span','','次');}
        const button=add(actions,'button','button account-refresh','刷新额度');button.type='button';button.id='account-refresh-'+encodeURIComponent(id);button.setAttribute('aria-label',t('刷新 {name} 的额度',{name:credentialName(item)}));button.title=button.getAttribute('aria-label');button.onclick=()=>refreshAccount(item.auth_id);
        const error=add(panel,'p','account-error','');error.setAttribute('role','status');
        const grid=add(panel,'div','windows');addWindow(grid,'5 小时','5h',item.five_hour);addWindow(grid,'7 天','7d',item.seven_day);
        entry={panel,button,error,stamp,backendError:item.error};cardCache.set(id,entry);showAccountError(id,accountErrors.get(id));
      }
      panels.push(entry.panel);
    });
    if(panels.length===cards.children.length&&panels.every((panel,i)=>panel.dataset.authId===cards.children[i].dataset.authId)){panels.forEach((panel,i)=>{if(panel!==cards.children[i])cards.children[i].replaceWith(panel);});}else cards.replaceChildren(...panels);
    sections.push(section);
  });
  for(const id of cardCache.keys())if(!present.has(id))cardCache.delete(id);
  if(sections.length!==root.children.length||sections.some((section,i)=>section!==root.children[i]))root.replaceChildren(...sections);
  syncAccountControls();
}
function addCell(tr,what,align){return add(tr,'td',align||'',what);}
function makeTable(root,caption,columns){
  const table=add(root,'table','');add(table,'caption','sr-only',caption);
  const group=add(table,'colgroup','');columns.forEach(([, ,width])=>{const col=add(group,'col','');col.style.width=width+'%';});
  const thead=add(table,'thead',''),head=add(thead,'tr','');columns.forEach(([label,cls])=>add(head,'th',cls,label).setAttribute('scope','col'));
  return add(table,'tbody','');
}
function renderSummary(credentials){
  const root=$('request-summary');root.replaceChildren();const sum=field=>credentials.reduce((n,s)=>n+(Number(s[field])||0),0);
  const priceMissing=credentials.some(s=>s.missing_price||s.cost==null);
  const stats=[['近 7 天请求',data?fmt(sum('requests')):'—'],['总 token',data?tokens(sum('total')):'—'],['失败',data?fmt(sum('failures')):'—'],['美元估算',data?priceMissing?'—':money(sum('cost')):'—']];
  stats.forEach(([label,value],i)=>{const item=add(root,'div','summary-item');add(item,'div','summary-label',label);const metric=add(item,'div','summary-value',value);if(i===1&&data)metric.title=fmt(sum('total'))+' '+t('token');});
}
function renderCredentials(credentials){
  const root=$('credential-table');root.replaceChildren();$('credential-count').textContent=t('{n} 个凭证',{n:data?fmt(credentials.length):'—'});
  if(!data){root.append(noData());return;}
  if(!credentials.length){root.append(empty('近 7 天暂无凭证请求','当前筛选下还没有观测到请求事件。新请求会在下次快照同步后显示。'));return;}
  const tbody=makeTable(root,'近 7 天凭证用量及模型', [['凭证','',19],['模型','',21],['请求','num',10],['输入','num',9],['输出','num',9],['缓存读取','num',10],['总 token','num',11],['估算美元','num',11]]);
  credentials.forEach((s,i)=>{
    const tr=add(tbody,'tr','');const label=addCell(tr,'');const button=add(label,'button','credential-button');button.type='button';button.id='credential-toggle-'+i;button.setAttribute('aria-expanded',String(expanded===s.auth_id));button.setAttribute('aria-controls','credential-detail-'+i);
    button.setAttribute('aria-label',t('查看 {name} 的模型用量',{name:credentialName(s)}));
    add(button,'span','chevron',expanded===s.auth_id?'⌄':'›').setAttribute('aria-hidden','true');add(button,'span','credential-name',credentialName(s));add(label,'span','cell-secondary',providerName(s.provider));
    const models=list(s.models);const modelcell=addCell(tr,'');[...new Set(models.map(m=>modelName(m.model)))].forEach(model=>add(modelcell,'div','model',model));if(!models.length)add(modelcell,'span','model',t('未知模型'));
    const requests=addCell(tr,fmt(s.requests),'num');add(requests,'span','cell-secondary'+(s.failures?' failure-count':''),t('{n} 次失败',{n:fmt(s.failures||0)}));
    ['input','output','cached','total'].forEach(field=>addTokens(tr,'td','num',s[field],''));const cost=addCell(tr,money(s.missing_price?null:s.cost),'num usd-value');if(s.missing_price||s.cost==null)add(cost,'span','cell-secondary','价格缺失');
    button.onclick=()=>{expanded=expanded===s.auth_id?'':s.auth_id;renderRequests();$(button.id)?.focus({preventScroll:true});};
    const detailtr=add(tbody,'tr','');detailtr.id='credential-detail-'+i;detailtr.hidden=expanded!==s.auth_id;
    if(expanded===s.auth_id){
      const cell=add(detailtr,'td','details-cell');cell.colSpan=8;const detail=add(cell,'div','details');add(detail,'h3','','各模型观测用量 · 近 7 天');
      if(!models.length)add(detail,'p','muted','暂无模型明细。');
      models.forEach(m=>{const row=add(detail,'div','modelrow');add(row,'span','model',modelName(m.model));const stats=add(row,'span','tabnum',t('{n} 次请求 · {tokens} token · {cost}',{n:fmt(m.requests),tokens:tokens(m.tokens),cost:money(m.cost)}));stats.title=fmt(m.tokens)+' '+t('token');});
    }
  });
}
function recentRequests(){
  const credentials=list(data?.credentials),quotas=list(data?.quotas);
  return list(data?.recent).slice(0,60).filter(x=>active({provider:x.provider||credentials.find(s=>s.auth_id===x.auth_id)?.provider||quotas.find(s=>s.auth_id===x.auth_id)?.provider}));
}
function renderRecent(){
  const root=$('recent-table');root.replaceChildren();const recent=recentRequests();const pages=Math.ceil(recent.length/pageSize);recentPage=Math.max(0,Math.min(recentPage,pages-1));
  const start=recentPage*pageSize, shown=recent.slice(start,start+pageSize);
  $('recent-prev').disabled=!data||recentPage===0;$('recent-next').disabled=!data||recentPage>=pages-1;$('recent-page').textContent=(pages?recentPage+1:0)+' / '+pages;
  $('recent-caption').textContent=data?(recent.length?t('显示 {start}–{end} / {n} 条',{start:start+1,end:start+shown.length,n:recent.length}):t('暂无近期记录')):t('等待请求快照');
  if(!data){root.append(noData());return;}
  if(!recent.length){root.append(empty('暂无近期请求','当前快照最多包含最近 60 条；当前筛选无匹配记录，不代表没有历史请求。'));return;}
  const tbody=makeTable(root,'最近最多 60 条请求快照', [['时间','',12],['凭证','',14],['模型','',16],['输入','num',7],['输出','num',7],['缓存 读 / 写','num',10],['总 token','num',9],['首字时间','num',8],['TPS','num',10],['状态','',7]]);
  shown.forEach(x=>{
    const tr=add(tbody,'tr','');const timecell=addCell(tr,'','timestamp');const time=add(timecell,'time','',clock(x.at));if(x.at)time.dateTime=x.at;time.title=when(x.at);const date=new Date(x.at);add(timecell,'span','cell-secondary',Number.isFinite(date.getTime())?date.toLocaleDateString(locale()):'未知日期');
    const credential=list(data.credentials).find(s=>s.auth_id===x.auth_id)||list(data.quotas).find(s=>s.auth_id===x.auth_id)||{auth_id:x.auth_id};
    const label=addCell(tr,credentialName(credential),'credential-name');add(label,'span','cell-secondary',providerName(x.provider||credential.provider));addCell(tr,modelName(x.model),'model');
    ['input','output'].forEach(field=>addTokens(tr,'td','num',x[field],''));const cache=addCell(tr,'','num cache-pair');addTokens(cache,'span','',x.cache_read,'');add(cache,'span','slash','/');addTokens(cache,'span','',x.cache_write,'');
    addTokens(tr,'td','num',x.total,'');addRequestTiming(tr,x);const state=addCell(tr,'');add(state,'span','request-state'+(x.failed?' failed':''),x.failed?'失败':'成功');
  });
}
function renderRequests(){const credentials=list(data?.credentials).filter(active);renderSummary(credentials);renderRecent();renderCredentials(credentials);$('request-count').textContent=data?fmt(credentials.reduce((n,s)=>n+(Number(s.requests)||0),0)):'—';}
function restoreFocus(id){if(id&&$(id)&&document.activeElement?.id!==id)$(id).focus({preventScroll:true});}
function render(){
  const focused=document.activeElement?.id;
  renderQuotas();renderRequests();updateSyncInfo();updatePersistence();
  quotaStamp=quotaContent(data);requestStamp=requestContent(data);
  restoreFocus(focused);
}
function setTab(selected){
  tab=selected==='requests'?'requests':'quota';
  ['quota','requests'].forEach(name=>{const selected=tab===name;$('tab-'+name).setAttribute('aria-selected',String(selected));$('tab-'+name).tabIndex=selected?0:-1;$('page-'+name).classList.toggle('hide',!selected);});
  $('dashboard').classList.toggle('request-view',tab==='requests');syncHeader();updateSyncInfo();
}
['quota','requests'].forEach(name=>{
  $('tab-'+name).onclick=()=>setTab(name);
  $('tab-'+name).addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();setTab(e.key==='Home'?'quota':e.key==='End'?'requests':tab==='quota'?'requests':'quota');$('tab-'+tab).focus();});
});
$('provider').onchange=e=>{filter=e.target.value;recentPage=0;expanded='';render();};
$('recent-prev').onclick=()=>{recentPage--;renderRecent();};$('recent-next').onclick=()=>{recentPage++;renderRecent();};
$('recent-size').value=String(pageSize);$('recent-size').onchange=e=>{const size=Number(e.target.value);pageSize=[20,40,60].includes(size)?size:20;$('recent-size').value=String(pageSize);recentPage=0;renderRecent();};
$('refresh').onclick=()=>tab==='requests'?refreshRequests():load(true);
$('language').onchange=e=>setLanguage(e.target.value);
$('persistence-enabled').onchange=e=>savePersistence(e.target.checked);
window.addEventListener('storage',e=>{if(e.key===languageStorage){setLanguage(initialLanguage(),false);return;}load();});
window.addEventListener('focus',()=>{if(!loading&&!accountJob&&Date.now()-lastSyncAt>=60000)load();});
applyLanguage();
load();
setInterval(()=>{if(!document.hidden&&!loading&&!accountJob)load();},60000);
setInterval(()=>{if(!document.hidden&&data)updateCountdowns();},30000);
})();

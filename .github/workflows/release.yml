name: Build native CPA plugin
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Test
        run: go test ./...
      - name: Test dashboard token formatting
        run: node --test testdata/dashboard_test.cjs
      - name: Build Linux amd64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o dist/release/cpa-mini-usage.so .
          rm -f dist/release/cpa-mini-usage.h
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then VERSION="$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')"; fi
          (cd dist/release && zip "cpa-mini-usage_${VERSION}_linux_amd64.zip" cpa-mini-usage.so)
          (cd dist/release && sha256sum "cpa-mini-usage_${VERSION}_linux_amd64.zip" > checksums.txt)
      - name: Verify real CPA 8.0.22 registration
        run: python3 testdata/cpa_registration.py dist/release/cpa-mini-usage.so
      - name: Save downloadable Linux AMD64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: cpa-mini-usage-linux-amd64
          path: |
            dist/release/cpa-mini-usage.so
            dist/release/cpa-mini-usage_*.zip
            dist/release/checksums.txt
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/release/*.zip dist/release/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/release/*.zip dist/release/checksums.txt --generate-notes
          fi
